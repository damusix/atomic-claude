name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./atomic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ./atomic/go.mod
          # go.sum is under atomic/, not the repo root. Without this the
          # action's default cache silently fails both restore and save, so
          # every run recompiles cold and no test results are ever reused.
          cache-dependency-path: ./atomic/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install frontend dependencies
        working-directory: ./atomic/internal/serve/frontend
        run: bun install --frozen-lockfile

      # The bundle and frontend/dist are both gitignored, so there is no drift
      # gate here — only the generation step that makes internal/embedded and
      # internal/serve compile.
      - name: Generate bundle and frontend
        run: go generate ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: Validate
        working-directory: ./atomic
        run: |
          make build
          ../bin/atomic validate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./atomic/internal/serve/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      # dist/ is gitignored, so this only proves the app builds — the test
      # job's `go generate` produces the copy that gets embedded.
      - name: Build
        run: bun run build.ts

  merge-next-release:
    needs: [test, frontend]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.base.ref == 'next'
      && github.event.pull_request.head.ref == 'release-please--branches--next'
      && github.event.pull_request.head.repo.id == github.event.repository.id
      && github.event.pull_request.user.id == github.event.repository.owner.id
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Squash-merge the tested prerelease PR
        shell: bash
        env:
          # A GITHUB_TOKEN merge would not trigger Release Please on the resulting push.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          pr="repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          current=$(gh api "$pr")
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$PR_HEAD" --arg tested "$GITHUB_SHA" '
            .state == "open" and .draft == false
            and .base.ref == "next" and .base.repo.full_name == $repo
            and .head.ref == "release-please--branches--next" and .head.repo.full_name == $repo
            and .head.sha == $head and .merge_commit_sha == $tested
            and any(.labels[]; .name == "autorelease: pending")
          ' <<< "$current" > /dev/null; then
            echo "The PR is no longer an open prerelease with the tested revision. Leaving it untouched."
            exit 0
          fi

          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/next" --jq '.object.sha')
          if [[ "$base" != "$PR_BASE" ]]; then
            echo "next has advanced since this run. Leaving the PR for current CI."
            exit 0
          fi

          merged=$(gh api --method PUT "$pr/merge" -f sha="$PR_HEAD" -f merge_method=squash --jq '.merged')
          [[ "$merged" == true ]]

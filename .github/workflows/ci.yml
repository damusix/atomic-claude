name: CI

on:
  # Push-CI runs only on main (post-merge). PR branches are gated by the
  # pull_request trigger below, so a branch with an open PR is tested once —
  # not twice, as the previous push-on-every-branch trigger did (one run for the
  # branch push, a duplicate for the PR). The release-please bot branch is
  # naturally excluded (it isn't main); its merge-into-main result is still
  # gated via pull_request, which always reflects current main.
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./atomic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ./atomic/go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install frontend dependencies
        working-directory: ./atomic/internal/serve/frontend
        run: bun install --frozen-lockfile

      # The bundle is gitignored, so there is no drift gate here — only the
      # generation step that makes internal/embedded compile.
      - name: Generate bundle
        run: go generate ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: Validate
        working-directory: ./atomic
        run: |
          make build
          ../bin/atomic validate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./atomic/internal/serve/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: bun run build.ts

      - name: Verify frontend dist is committed
        working-directory: .
        run: git diff --exit-code -- atomic/internal/serve/frontend/dist

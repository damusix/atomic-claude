name: release-please

on:
  push:
    branches: [main, next]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Both branches run the same action against their own config/manifest pair.
  # Release-PR branches are named per target branch and the last-release lookup
  # matches the manifest's exact version string, so the two runs never see each
  # other's tags. Both pairs are committed on both branches: diverging a single
  # config between them would conflict on every next -> main merge.
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          target-branch: ${{ github.ref_name }}
          config-file: ${{ github.ref_name == 'next' && 'release-please-config.next.json' || 'release-please-config.json' }}
          manifest-file: ${{ github.ref_name == 'next' && 'release-please-manifest.next.json' || 'release-please-manifest.json' }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
